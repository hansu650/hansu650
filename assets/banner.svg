<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Qin Tian GitHub Profile Banner</title>
  <desc id="desc">Animated wave banner for Qin Tian, software engineering undergraduate.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5F6B76"/>
      <stop offset="0.55" stop-color="#7787A0"/>
      <stop offset="1" stop-color="#B176C2"/>
    </linearGradient>
    <linearGradient id="waveA" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#CBD5E1" stop-opacity="0.78"/>
      <stop offset="0.52" stop-color="#E0E7FF" stop-opacity="0.56"/>
      <stop offset="1" stop-color="#F5D0FE" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="waveB" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#94A3B8" stop-opacity="0.70"/>
      <stop offset="0.55" stop-color="#C4B5FD" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#F0ABFC" stop-opacity="0.54"/>
    </linearGradient>
    <filter id="titleShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1E293B" flood-opacity="0.20"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#background)"/>

  <g filter="url(#titleShadow)">
    <text x="600" y="145" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="750" letter-spacing="0">
      Qin Tian
    </text>
    <text x="600" y="195" text-anchor="middle" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="650" letter-spacing="0">
      Software Engineering Undergraduate
    </text>
    <text x="600" y="232" text-anchor="middle" fill="#E0F2FE" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="520" letter-spacing="0">
      Backend / Frontend / AI Engineering / Data Analysis
    </text>
  </g>

  <g>
    <path fill="url(#waveB)" opacity="0.64" d="M-120 270C12 236 126 252 248 282C390 318 522 304 658 254C798 202 930 211 1062 262C1142 293 1216 293 1320 260V320H-120V270Z">
      <animateTransform attributeName="transform" type="translate" values="0 0; 60 0; 0 0" dur="7s" repeatCount="indefinite"/>
    </path>
    <path fill="url(#waveA)" opacity="0.82" d="M-120 292C12 252 138 263 274 286C418 311 536 320 674 286C820 250 940 216 1082 242C1176 259 1254 293 1320 262V320H-120V292Z">
      <animateTransform attributeName="transform" type="translate" values="0 0; -72 0; 0 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path fill="#FFFFFF" opacity="0.96" d="M-120 314C22 294 150 292 286 307C426 322 562 335 712 312C868 288 1008 254 1150 276C1222 287 1278 306 1320 290V320H-120V314Z">
      <animateTransform attributeName="transform" type="translate" values="0 0; 48 0; 0 0" dur="11s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
