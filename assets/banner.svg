<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Qin Tian GitHub Profile Banner</title>
  <desc id="desc">A clean blue-gray banner for Qin Tian, software engineering undergraduate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.52" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="accent" x1="120" y1="60" x2="1060" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0.42"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="0" fill="url(#bg)"/>
  <path d="M0 238C153 168 280 185 417 215C572 249 677 284 842 221C961 176 1077 121 1200 151V320H0V238Z" fill="url(#accent)" opacity="0.65"/>
  <path d="M88 74C208 39 306 46 413 85C556 137 638 138 766 89C883 45 1014 37 1118 78" stroke="#93C5FD" stroke-width="2" opacity="0.28"/>
  <path d="M92 247C232 192 351 188 489 231C622 273 742 270 869 216C967 174 1064 166 1162 198" stroke="#99F6E4" stroke-width="2" opacity="0.24"/>

  <g filter="url(#softShadow)">
    <rect x="74" y="58" width="1052" height="204" rx="24" fill="#0F172A" fill-opacity="0.34" stroke="#E0F2FE" stroke-opacity="0.16"/>
  </g>

  <text x="112" y="132" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="0">
    Qin Tian
  </text>
  <text x="114" y="174" fill="#DBEAFE" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="500" letter-spacing="0">
    Software Engineering Undergraduate
  </text>
  <text x="114" y="213" fill="#CCFBF1" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" letter-spacing="0">
    Backend / Frontend / AI Engineering / Data Analysis
  </text>

  <g transform="translate(870 93)">
    <rect x="0" y="0" width="196" height="42" rx="8" fill="#EFF6FF" fill-opacity="0.12" stroke="#BFDBFE" stroke-opacity="0.25"/>
    <text x="18" y="28" fill="#E0F2FE" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600">Rank #1</text>
    <rect x="0" y="58" width="196" height="42" rx="8" fill="#ECFDF5" fill-opacity="0.12" stroke="#A7F3D0" stroke-opacity="0.25"/>
    <text x="18" y="86" fill="#CCFBF1" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600">Avg 91.62 / 100</text>
    <rect x="0" y="116" width="196" height="42" rx="8" fill="#F5F3FF" fill-opacity="0.12" stroke="#DDD6FE" stroke-opacity="0.25"/>
    <text x="18" y="144" fill="#EDE9FE" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600">Lanqiao Python</text>
  </g>
